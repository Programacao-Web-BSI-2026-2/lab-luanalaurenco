<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- Descrição da página -->
    <meta name="description" content="Área de contato do cliente. Envie sua mensagem para a equipe de suporte técnico e obtenha ajuda com nossos serviços.">


    <title>Área de Contato do Cliente</title>
</head>


<body>


    <!-- Link relativo para o Portfólio Central -->
    <nav aria-label="Navegação do portfólio">
        <a href="../../index.html">
            ← Voltar ao Portfólio Central
        </a>
    </nav>


    <hr>


    <!-- Cabeçalho -->
    <header id="cabecalho">
        <h1 class="titulo">Área de Contato do Cliente</h1>


        <nav class="menu">
            <a href="#">Ajuda</a> |
            <a href="#">Sair</a>
        </nav>
    </header>


    <hr>


    <!-- Conteúdo principal -->
    <main id="corpo-da-pagina">


        <article class="subtitulo">
            <h2>
                Envie sua mensagem para a nossa
                equipe de suporte backend
            </h2>


            <!-- Formulário de contato -->
            <form action="/enviar" method="POST">


                <!-- Nome -->
                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    minlength="3"
                    required
                >
                <br><br>


                <!-- E-mail -->
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    minlength="5"
                    required
                >
                <br><br>


                <!-- Telefone -->
                <label for="celular">Telefone Celular:</label>
                <input
                    type="tel"
                    id="celular"
                    name="celular"
                    pattern="[0-9]{11}"
                    title="Digite exatamente 11 números"
                    required
                >
                <br><br>


                <!-- Mensagem -->
                <label for="msg">Mensagem:</label>
                <br>
                <textarea
                    id="msg"
                    name="msg"
                    rows="5"
                    cols="40"
                    required
                ></textarea>
                <br><br>


                <!-- Botão de envio -->
                <input
                    type="submit"
                    value="Disparar Dados"
                >


            </form>
        </article>


    </main>


    <hr>


    <!-- Rodapé -->
    <footer id="rodape">
        <p>Suporte Tech 2026</p>
        <p>Laboratório 01 - Programação Web</p>


        <a href="../../index.html">
            Voltar ao Portfólio Central
        </a>
    </footer>


</body>
</html>
