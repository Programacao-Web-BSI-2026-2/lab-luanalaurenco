<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Descrição Descritiva para os crawlers do Google -->
    <meta name="description" content="Área de contato do cliente. Envie sua mensagem para a equipe de suporte técnico e obtenha ajuda com nossos serviços.">
    
    <title>Área de Contato do Cliente</title>
</head>
<body>

    <!-- Tag Estrutural: header -->
    <header id="cabecalho">
        <h1 class="titulo">Área de Contato do Cliente</h1>
        
        <!-- Tag Estrutural: nav -->
        <nav class="menu">
            <a href="#">Ajuda</a> | <a href="#">Sair</a>
        </nav>
    </header>

    <!-- Tag Estrutural: main -->
    <main id="corpo-da-pagina">
        
        <!-- Tag Estrutural: article -->
        <article class="subtitulo">
            <h2>Envie sua mensagem para a nossa equipe de suporte backend</h2>
            
            <!-- Formulário com envio seguro (POST) -->
            <form action="/enviar" method="POST">
                
                <label for="nome">Nome:</label>
                <!-- Validação: Obrigatório e com tamanho mínimo -->
                <input type="text" id="nome" name="nome" minlength="3" required><br><br>
                
                <label for="email">Email:</label>
                <!-- Validação: Tipo nativo para email, obrigatório e tamanho mínimo -->
                <input type="email" id="email" name="email" minlength="5" required><br><br>
                
                <label for="celular">Telefone Celular:</label>
                <!-- Validação: Pattern exigindo exatamente 11 caracteres numéricos -->
                <input type="tel" id="celular" name="celular" pattern="[0-9]{11}" title="Digite exatamente 11 números" required><br><br>
                
                <label for="msg">Mensagem:</label>
                <textarea id="msg" name="msg" required></textarea><br><br>
                
                <input type="submit" value="Disparar Dados">
            </form>
        </article>
        
    </main>

    <!-- Tag Estrutural: footer -->
    <footer id="rodape">
        <p>Suporte Tech 2026</p>
    </footer>

</body>
</html>
